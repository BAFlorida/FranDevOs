  /integrations/status:
    get:
      tags: [Integrations]
      operationId: getIntegrationStatus
      summary: Connection cards — per-source status, last sync, objects synced, recent events
      responses:
        "200":
          description: Connection status cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationConnectionCard"

  /integrations/refresh:
    post:
      tags: [Integrations]
      operationId: refreshIntegration
      summary: Mock "Refresh from source" — bumps syncedAt/lastSyncAt and writes a sync event
      description: >-
        No external CRM call. Updates the connection's lastSyncAt, bumps syncedAt
        on that source's canonical rows, and appends a crm_sync_events row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshIntegrationInput"
      responses:
        "200":
          description: Updated connection card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationConnectionCard"
        "404":
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LoginCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    InvitationAcceptance:
      type: object
      required: [token, name, password]
      properties:
        token:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
    PasswordReset:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8
    ImpersonationTarget:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          minLength: 1
    UserRole:
      type: string
      enum: [member, lead, admin, vp, super_admin, observer]
    ActingIdentity:
      type: object
      description: The real super admin behind an impersonated session.
      required: [id, name, avatarColor, role, profileImageUrl]
      properties:
        id:
          type: string
        name:
          type: string
        avatarColor:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        profileImageUrl:
          type: [string, 'null']
    AppUser:
      type: object
      required: [id, name, email, role, avatarColor]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: [string, 'null']
        role:
          $ref: "#/components/schemas/UserRole"
        avatarColor:
          type: string
        profileImageUrl:
          type: [string, 'null']
        hasLogin:
          type: boolean
          description: True when the member has set a password and can sign in.
        isActive:
          type: boolean
          description: False when the user has been deactivated and can no longer log in.
        permissions:
          type: array
          description: Resolved permission keys for this user's role (populated on /me).
          items:
            $ref: "#/components/schemas/PermissionKey"
        impersonating:
          type: boolean
          description: True when a super admin is currently acting as this user.
        realUser:
          oneOf:
            - $ref: "#/components/schemas/ActingIdentity"
            - type: 'null'
          description: The real super admin driving an impersonated session, else null.
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: [string, 'null']
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        avatarColor:
          type: string
    UserCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: [string, 'null']
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        avatarColor:
          type: string

    UserMerge:
      type: object
      required: [sourceUserId]
      properties:
        sourceUserId:
          type: string
          minLength: 1
          description: >-
            The duplicate account to retire. All of its user-id references are
            moved onto the surviving account named in the path.

    PermissionKey:
      type: string
      enum:
        - impersonate_users
        - manage_users
        - manage_permissions
        - view_audit_log
        - manage_access_requests
        - manage_invitations
        - manage_groups
        - assign_tasks
        - approve_completion
        - edit_initiatives
        - delete_initiatives
        - manage_targets
        - view_reports
        - run_reports
        - manage_metrics
        - manage_integrations
    Permission:
      type: object
      required: [key, label, description, category, sortOrder]
      properties:
        key:
          $ref: "#/components/schemas/PermissionKey"
        label:
          type: string
        description:
          type: string
        category:
          type: string
        sortOrder:
          type: integer
    RolePermissions:
      type: object
      required: [role, permissions]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
    PermissionMatrix:
      type: object
      required: [catalog, roles]
      description: Permission catalog plus the current role -> permission mapping.
      properties:
        catalog:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RolePermissions"
    RolePermissionsUpdate:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"

    AuditLogEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id:
          type: integer
        actorId:
          type: [string, 'null']
        actorName:
          type: [string, 'null']
        action:
          type: string
        targetType:
          type: [string, 'null']
        targetId:
          type: [string, 'null']
        targetLabel:
          type: [string, 'null']
        before:
          description: Snapshot before the change (shape varies by action).
        after:
          description: Snapshot after the change (shape varies by action).
        createdAt:
          type: string
          format: date-time

    AccessRequestKind:
      type: string
      enum: [account, access]
    AccessRequestStatus:
      type: string
      enum: [pending, approved, denied]
    AccessRequest:
      type: object
      required: [id, kind, requestedRole, status, createdAt]
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/AccessRequestKind"
        requesterUserId:
          type: [string, 'null']
        requesterName:
          type: [string, 'null']
        requesterEmail:
          type: [string, 'null']
        requestedRole:
          $ref: "#/components/schemas/UserRole"
        reason:
          type: [string, 'null']
        status:
          $ref: "#/components/schemas/AccessRequestStatus"
        decidedById:
          type: [string, 'null']
        decidedByName:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time
        resultInvitationId:
          type: [integer, 'null']
        createdAt:
          type: string
          format: date-time
    AccessRequestInput:
      type: object
      required: [kind]
      description: >-
        Submit an account request (provision a new user) or an access request
        (elevate an existing member). For account requests, name is required.
      properties:
        kind:
          $ref: "#/components/schemas/AccessRequestKind"
        name:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        requestedRole:
          $ref: "#/components/schemas/UserRole"
        reason:
          type: [string, 'null']

    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked]
    InvitationInput:
      type: object
      required: [role]
      description: >-
        Either link to an existing unclaimed member via targetUserId, or create a
        new member by providing newMemberName.
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
        targetUserId:
          type: [string, 'null']
          description: Existing member to link this invite to (must not already have a login).
        newMemberName:
          type: [string, 'null']
          description: Name of the new member to create on accept (when targetUserId is absent).
        newMemberEmail:
          type: [string, 'null']
          format: email
    Invitation:
      type: object
      required: [id, token, role, status, createdAt, inviteUrl]
      properties:
        id:
          type: integer
        token:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        targetUserId:
          type: [string, 'null']
