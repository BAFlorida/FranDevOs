      type: string
      enum: [opportunities, campaigns, accounts, people, email_activity]

    ReportFilter:
      type: object
      required: [field, op, value]
      properties:
        field:
          type: string
        op:
          type: string
          enum: [eq, neq, in, notIn, gt, gte, lt, lte]
        value: {}

    ReportMetric:
      type: object
      required: [agg]
      properties:
        agg:
          type: string
          enum: [count, sum, avg]
        field:
          type: [string, 'null']
          description: Numeric field to aggregate. Ignored for count.
        label:
          type: [string, 'null']

    ReportChartType:
      type: string
      enum: [bar, line, pie, area, table]

    ReportSpec:
      type: object
      required: [sources, dimensions, metrics]
      properties:
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReportSource"
        dimensions:
          type: array
          description: Fields to group rows by; each becomes a dimension column.
          items:
            type: string
        metrics:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReportMetric"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/ReportFilter"
        groupBy:
          type: [string, 'null']
          description: Optional primary grouping field (defaults to the first dimension).
        chartType:
          oneOf:
            - $ref: "#/components/schemas/ReportChartType"
            - type: 'null'

    ReportColumn:
      type: object
      required: [key, label, kind]
      properties:
        key:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [dimension, metric]

    ReportResult:
      type: object
      required: [spec, generatedAt, columns, rows]
      properties:
        spec:
          $ref: "#/components/schemas/ReportSpec"
        generatedAt:
          type: string
          format: date-time
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ReportColumn"
        rows:
          type: array
          description: Each row is keyed by column key; cells are string, number, or null.
          items:
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: number
                - type: 'null'

    ReportDefinition:
      type: object
      required: [id, name, spec, isPreset, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        spec:
          $ref: "#/components/schemas/ReportSpec"
        isPreset:
          type: boolean
        createdById:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    ReportDefinitionInput:
      type: object
      required: [name, spec]
      properties:
        name:
          type: string
          minLength: 1
        spec:
          $ref: "#/components/schemas/ReportSpec"
