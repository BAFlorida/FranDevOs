        Creates a row in the existing tasks table and a crm_task_links row that
        associates it with a CRM record, without modifying the tasks contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkedTaskInput"
      responses:
        "201":
          description: Created task and its CRM link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedTaskResponse"
        "404":
          description: Linked CRM record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /reports/definitions:
