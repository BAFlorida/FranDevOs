openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Franchise Development OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Users
    description: Users and roles
  - name: Invitations
    description: Admin-issued copy-paste login invites and account claim flow.
  - name: Access
    description: Permission catalog & role mapping, audit log, and access/account requests.
  - name: FocusAreas
    description: Focus areas
  - name: Projects
    description: Projects (with computed rollups)
  - name: Tasks
    description: Tasks
  - name: Dashboard
    description: Executive dashboard rollups
  - name: CRM
    description: Canonical CRM records (opportunities, campaigns, email activity) reconciled from Salesforce and HubSpot.
  - name: Reporting
    description: Saved report definitions and on-demand report runs over canonical CRM data.
  - name: Integrations
    description: CRM connection status and sync history (mock; future Salesforce/HubSpot sync seam).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCredentials'
      responses:
        '200':
          description: Signed in successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          description: Missing email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Account deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Clear the current session
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /auth/accept-invite:
    post:
      tags: [Auth]
      operationId: acceptInvitation
      summary: Claim an invite link by setting name and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
      responses:
        '200':
          description: Invite accepted; user is now signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          description: Invalid invite, name, or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changeMyPassword
      summary: Change your own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
        '400':
          description: Current password incorrect or new password invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /users/{id}/reset-password:
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Reset another user's password (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '200':
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          description: Invalid password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not permitted to reset this user's password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /impersonate/start:
    post:
      tags: [Auth]
      operationId: startImpersonation
      summary: Begin acting as another user (super admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpersonationTarget'
      responses:
        '200':
          description: Now acting as the target user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          description: Invalid target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not permitted to impersonate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /impersonate/stop:
    post:
      tags: [Auth]
      operationId: stopImpersonation
      summary: Stop impersonating and return to your own identity
      responses:
        '200':
          description: Returned to the real identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'

  /me:
    get:
      tags: [Users]
      operationId: getMe
      summary: Get the current user's app profile (with role)
      responses:
        "200":
          description: Current app user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List all team members
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user (manage_users)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /users/{id}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"

  /users/{id}/merge:
    post:
      tags: [Users]
      operationId: mergeUser
      summary: Merge a duplicate member into a surviving member (manage_users)
      description: >-
        Repoints every user-id reference (task assignee/blocked/escalation
        columns, attachments, groups, group memberships, metrics, KPI audit,
        invitations, audit log, access requests, and more) from the source
        account onto the surviving account given in the path, then retires the
        source. Used to reconcile split member identities so a person ends up
        with a single account that holds all of their work.
      parameters:
        - name: id
          in: path
          required: true
          description: The surviving account that references are merged onto.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserMerge"
      responses:
        "200":
          description: Merged; the surviving account is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "400":
          description: Invalid merge (same account, missing source, or self).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not permitted to merge this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Source or surviving account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invitations:
    get:
      tags: [Invitations]
      operationId: listInvitations
      summary: List all invitations (admin/vp)
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Create an invitation (admin/vp)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /invitations/{id}/revoke:
    post:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: Revoke a pending invitation (admin/vp)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /invitations/{id}/regenerate:
    post:
      tags: [Invitations]
      operationId: regenerateInvitation
      summary: Regenerate a pending invitation's token (admin/vp)
      description: >-
        Issues a fresh token for a pending invitation, keeping the same target
        and role. The old token stops working immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          description: Only pending invitations can be regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /invitations/by-token/{token}:
    get:
      tags: [Invitations]
      operationId: getInvitationByToken
      summary: Get public details of an invitation by token (unauthenticated)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInvitation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/{id}/deactivate:
    post:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate a user (manage_users)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deactivated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /users/{id}/activate:
    post:
      tags: [Users]
      operationId: activateUser
      summary: Reactivate a user (manage_users)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reactivated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /permissions:
    get:
      tags: [Access]
      operationId: getPermissionMatrix
      summary: Get the permission catalog and role mapping (manage_permissions)
      responses:
        "200":
          description: Permission matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionMatrix"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /roles/{role}/permissions:
    put:
      tags: [Access]
      operationId: updateRolePermissions
      summary: Replace the permissions granted to a role (manage_permissions)
      parameters:
        - name: role
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionsUpdate"
      responses:
        "200":
          description: Updated role mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermissions"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /audit-log:
    get:
      tags: [Access]
      operationId: listAuditLog
      summary: List audit-log entries with optional filters (view_audit_log)
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: actorId
          in: query
          required: false
          schema:
            type: string
        - name: targetType
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Audit-log entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /access-requests:
    get:
      tags: [Access]
      operationId: listAccessRequests
      summary: List access/account requests (manage_access_requests)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccessRequestStatus"
      responses:
        "200":
          description: Requests (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessRequest"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Access]
      operationId: createAccessRequest
      summary: >-
        Submit an account or access request. PUBLIC: people without an account
        may submit account requests (rate-limited). Authenticated members may
        also request elevated access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Access (elevation) requests require an authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many requests from this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /access-requests/{id}/approve:
    post:
      tags: [Access]
      operationId: approveAccessRequest
      summary: Approve a pending request (manage_access_requests)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "400":
          description: Invalid state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /access-requests/{id}/deny:
    post:
      tags: [Access]
      operationId: denyAccessRequest
      summary: Deny a pending request (manage_access_requests)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Denied request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /focus-areas:
    get:
      tags: [FocusAreas]
      operationId: listFocusAreas
      summary: List all focus areas in sort order
      responses:
        "200":
          description: List of focus areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FocusArea"
    post:
      tags: [FocusAreas]
      operationId: createFocusArea
      summary: Create a strategic pillar (lead/admin/vp)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusAreaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusArea"

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List all projects with live-computed rollups
      responses:
        "200":
          description: Projects with rollups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectWithRollup"
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project (lead/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWithRollup"
  /projects/{id}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project (with rollups and tasks)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project (lead/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWithRollup"
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks (optionally filtered by assignee or project)
      parameters:
        - name: assigneeId
          in: query
          required: false
          schema:
            type: string
        - name: projectId
          in: query
          required: false
          schema:
            type: string
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    get:
      tags: [Tasks]
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      tags: [Tasks]
      operationId: updateTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      tags: [Tasks]
      operationId: deleteTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}/escalate:
    post:
      tags: [Tasks]
      operationId: escalateRoadblock
      summary: Escalate a roadblock on a task upward to the responsible higher-up
      description: >-
        Flags the task as Blocked and opens an escalation routed automatically to
        the executive owner of the task's initiative (with an admin/vp fallback).
        Members may only escalate their own tasks and can never choose the target.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalateInput"
      responses:
        "200":
          description: Task with the escalation opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input or no higher-up available to escalate to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden — you can only escalate your own task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /escalations:
    get:
      tags: [Tasks]
      operationId: listEscalations
      summary: List open roadblocks escalated to the current higher-up
      responses:
        "200":
          description: Open escalations routed to the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /blocked-tasks:
    get:
      tags: [Tasks]
      operationId: listBlockedTasks
      summary: List all open Blocked tasks across the team (excluding active escalations)
      description: >-
        Returns every open task currently in Blocked status across the team,
        excluding tasks that have an active, unresolved escalation (those appear
        in the escalation queue instead, so the two lists never duplicate a card).
        Read-only and restricted to users holding the approve-completion
        permission, mirroring the Roadblocks page gate.
      responses:
        "200":
          description: Open blocked tasks across the team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "403":
          description: Forbidden — requires the approve-completion permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /escalations/{id}/resolve:
    post:
      tags: [Tasks]
      operationId: resolveEscalation
      summary: Resolve a roadblock escalation (returns to original developer by default)
      description: >-
        Clears the Blocked status and records who resolved it and when. By default
        the task returns to the original developer; the higher-up may instead
        reassign it to someone else. Only the higher-up the escalation was routed
        to (or an admin/vp) may resolve.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveEscalationInput"
      responses:
        "200":
          description: Task with the escalation resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input or no active escalation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden — only the higher-up may resolve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/attachments:
    get:
      tags: [Tasks]
      operationId: listTaskAttachments
      summary: List attachments (deliverable links) for a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskAttachment"
    post:
      tags: [Tasks]
      operationId: createTaskAttachment
      summary: Attach a deliverable link to a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskAttachmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAttachment"
  /tasks/{id}/attachments/{attachmentId}:
    delete:
      tags: [Tasks]
      operationId: deleteTaskAttachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard:
    get:
      tags: [Dashboard]
