# Render Blueprint — one service (API serves the built web app) + managed Postgres.
# Deploy: push this repo to GitHub, then on https://render.com create a new
# "Blueprint" from the repo. Render reads this file and provisions everything.
#
# One-time after the first deploy: apply the DB schema by running
#   DATABASE_URL="<the render database URL>" pnpm --filter @workspace/db run push
# from your machine (drizzle-kit push is non-interactive on a fresh database).
services:
  - type: web
    name: frandevos
    runtime: node
    plan: starter
    # --prod=false forces devDependencies (vite/esbuild/tsc) to install even
    # though NODE_ENV=production is set below.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      # Render injects PORT automatically; the server binds it.
      - key: DATABASE_URL
        fromDatabase:
          name: frandevos-db
          property: connectionString
      # Public URL of this service — used to build absolute links in emails.
      # After the first deploy, set this to your app's real URL (Render shows it),
      # e.g. https://frandevos.onrender.com, then redeploy.
      - key: APP_URL
        sync: false
      # Owner (Super Admin) account bootstrapped on first boot.
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      # Automated email (optional). Add these to turn on invite/reset emails.
      # Leave unset to share invite links manually. See .env.example for setup.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: frandevos-db
    plan: basic-256mb
