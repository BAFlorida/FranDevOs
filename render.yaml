# Render Blueprint — one service (API serves the built web app) + managed Postgres.
# Deploy: push this repo to GitHub, then on https://render.com create a new
# "Blueprint" from the repo. Render reads this file and provisions everything.
#
# The database schema is applied automatically before each deploy via the
# preDeployCommand below (drizzle-kit push is non-interactive on a fresh
# database, so the first deploy creates all tables with no manual step).
services:
  - type: web
    name: frandevos
    runtime: node
    plan: starter
    # Install pnpm directly (not via corepack, which can fail a signature check
    # on fresh build machines). --prod=false forces devDependencies
    # (vite/esbuild/tsc) to install even though NODE_ENV=production is set below.
    buildCommand: npm install -g pnpm@10.33.0 && pnpm install --frozen-lockfile --prod=false && pnpm run build
    # Apply the DB schema (create tables) before the new version goes live.
    preDeployCommand: pnpm --filter @workspace/db run push
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      # Pin the Node major version so builds are deterministic.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      # Render injects PORT automatically; the server binds it.
      - key: DATABASE_URL
        fromDatabase:
          name: frandevos-db
          property: connectionString
      # Public URL of this service — used to build absolute links in emails.
      # After the first deploy, set this to your app's real URL (Render shows it),
      # e.g. https://frandevos.onrender.com, then redeploy.
      - key: APP_URL
        sync: false
      # Owner (Super Admin) account bootstrapped on first boot.
      - key: SUPER_ADMIN_EMAIL
        value: ryan.maynard@eversmithbrands.com
      - key: SUPER_ADMIN_NAME
        value: Ryan Maynard
      # Automated email (optional). Add these to turn on invite/reset emails.
      # Leave unset to share invite links manually. See .env.example for setup.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: frandevos-db
    plan: basic-256mb
