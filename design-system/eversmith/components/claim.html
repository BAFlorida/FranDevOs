<!-- @dsCard group="Structure" name="Claim headline" subtitle="The headline is the argument, not a topic label" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim headline — EverSmith DS</title>
<link rel="stylesheet" href="../eversmith-ds.css">
<style>
  body { margin: 0; background: #EDEEEA; }
  .card { padding: 32px; background: var(--esb-paper); }
  .banned { border-left: 3px solid var(--esb-signal); padding-left: 16px; margin-top: 24px; }
  .banned-k { font-family: var(--esb-font-data); font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
              text-transform: uppercase; color: var(--esb-signal); margin-bottom: 6px; }
  .banned p { font-family: var(--esb-font-body); font-size: 14px; color: var(--esb-graphite); margin: 0 0 4px; }
  .banned s { color: var(--esb-mute); }
</style>
</head>
<body class="esb">
  <div class="card">
    <div class="esb-eyebrow">Lead Generation · Q3</div>
    <h2 class="esb-claim esb-wide">Paid cost per qualified lead fell 78% while qualified volume held flat</h2>
    <div class="banned">
      <div class="banned-k">Banned headlines</div>
      <p><s>Q3 Lead Performance</s> — a topic. Tells the reader nothing.</p>
      <p><s>Marketing Update</s> — a filing category, not an argument.</p>
      <p><s>Key Takeaways</s> — if they were key, they would be the headline.</p>
    </div>
  </div>
</body>
</html>
