<!-- @dsCard group="Data" name="Use of funds" subtitle="One horizontal bar, keyed beneath — never a pie chart" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Use of funds — EverSmith DS</title>
<link rel="stylesheet" href="../eversmith-ds.css">
<style>
  body { margin: 0; background: #EDEEEA; }
  .card { padding: 32px; background: var(--esb-paper); }
</style>
</head>
<body class="esb">
  <div class="card">
    <div class="esb-uof">
      <div class="esb-uof-seg" style="flex:42;background:var(--esb-d2)"></div>
      <div class="esb-uof-seg" style="flex:26;background:var(--esb-d3)"></div>
      <div class="esb-uof-seg" style="flex:19;background:var(--esb-d4)"></div>
      <div class="esb-uof-seg" style="flex:13;background:var(--esb-d5)"></div>
    </div>
    <div class="esb-uof-key">
      <div class="esb-uof-key-i" style="border-color:var(--esb-d2)"><div class="esb-uof-key-k">Paid media</div><div class="esb-uof-key-v">42%</div></div>
      <div class="esb-uof-key-i" style="border-color:var(--esb-d3)"><div class="esb-uof-key-k">Systems / RevOps</div><div class="esb-uof-key-v">26%</div></div>
      <div class="esb-uof-key-i" style="border-color:var(--esb-d4)"><div class="esb-uof-key-k">Headcount</div><div class="esb-uof-key-v">19%</div></div>
      <div class="esb-uof-key-i" style="border-color:var(--esb-d5)"><div class="esb-uof-key-k">Content / brand</div><div class="esb-uof-key-v">13%</div></div>
    </div>
    <div style="margin-top:20px"><span class="esb-illustrative">Illustrative — replace before issue</span></div>
  </div>
</body>
</html>
