# ------------------------------------------------------- functional taxonomy
# Every career role is tagged with ZERO OR MORE functions by matching these
# patterns against the token-joined title (multi-label: "Sales & Marketing
# Manager" is sales AND marketing AND general_management). Person-level
# background tiers are derived from pre-franchise months in each function:
#   touched >= 1 role · experienced >= 36 months · career >= 84 months, or
#   >= 50% of the person's dated pre-franchise career with >= 36 months.
