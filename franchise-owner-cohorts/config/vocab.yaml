# Vocabulary for the analysis warehouse (roles/persons/cohorts).
#
# THE RULE: every regex that defines "ownership", "corporate", or a cohort lives
# HERE, never inline in a script. The 545-vs-480 discrepancy happened because two
# scripts each invented their own corporate-title regex; this file is the fix.
#
# Matching surface: patterns run against the TOKEN-JOINED lowercase form of the
# title or company — pipeline_lib.tokens() joined with single spaces, so
# "Co-Owner / G.M." becomes "co owner g m". Punctuation never matters here.
# Patterns are Python regexes; \b word boundaries work as expected.

ownership:
  # A role whose title asserts equity in / founding of the business itself.
  # Deliberately EXCLUDES bare president/ceo/partner: an employer's president is
  # employment, not ownership. That looseness is where the 545 figure came from.
  patterns:
    - '\bowner\b'              # owner, co owner, owner operator, business owner
    - '\bfounder\b'            # founder, co founder
    - '\bproprietor\b'
    - '\bfranchisee\b'
    - '\bmanaging member\b'
    - '\bmanaging partner\b'
    - '\bself employed\b'
  exclude:                     # contain the words above but are not equity
    - '\bproduct owner\b'
    - '\bprocess owner\b'
    - '\bowner s representative\b'

corporate:
  # A role whose title reads as employment inside someone else's organization.
  # Precedence: a role matching ownership is NEVER corporate, whatever else its
  # title contains ("Owner & General Manager" is ownership).
  patterns:
    - '\bmanager\b'
    - '\bdirector\b'
    - '\bvice president\b'
    - '\bvp\b'
    - '\bpresident\b'
    - '\bchief\b'
    - '\bofficer\b'
    - '\bsupervisor\b'
    - '\bsuperintendent\b'
    - '\bexecutive\b'
    - '\banalyst\b'
    - '\bengineer\b'
    - '\bconsultant\b'
    - '\bspecialist\b'
    - '\bcoordinator\b'
    - '\brepresentative\b'
    - '\bassociate\b'
    - '\badministrator\b'
    - '\bcontroller\b'
    - '\bcomptroller\b'
    - '\badvisor\b'
    - '\bagent\b'
    - '\bsales\b'
    - '\baccountant\b'
    - '\battorney\b'
    - '\bcounsel\b'
    - '\bbanker\b'
    - '\brecruiter\b'
    - '\bteacher\b'
    - '\bprofessor\b'
    - '\binstructor\b'
    - '\bnurse\b'
    - '\btechnician\b'
    - '\bforeman\b'

