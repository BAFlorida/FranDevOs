# Employer strings that name the franchisor / parent / franchise-development
# organization rather than a local unit. A role at one of these is
# franchise_role_kind = 'franchisor' (employment inside the system, not a
# purchase). config/company_exclusions.csv adds the named entities.
franchisor_employers:
  - '\bfranchising\b'
  - '\bfranchisor\b'
  - '\bfranchise (system|systems|group|corporation|corp|development|concepts|brands|holdings|company|co)\b'
  - '\bcorporate office\b'
  - '\bworld headquarters\b'

