# ------------------------------------------------------------------ constants

recent_start_ym_min: 24240         # 2020-01 in months-since-year-0 (2020*12)
tenure_min_months: 36              # cohort 9 "three-year tenure"
still_employed_grace_months: 3     # cohort 9: role end within this of franchise start

# ------------------------------------------------------- function tags (7)
# Single-label collapse of the 16 functions above into the seven analysis
# tags. A role gets the FIRST tag in this order whose member function it
# matches — specific beats generic: "VP Sales" is sales not gm, "CFO" is
# finance not gm, "Operations Engineer" is technical not ops. A role matching
# no member function is 'other' (marketing, HR, education, hospitality,
# real estate, customer service and untagged titles all land there; the
# 16-way `function_detail` / `functions` columns keep the finer label).
function_tags:
  sales: [sales]
  clinical: [healthcare_clinical]
  finance: [finance_accounting]
  technical: [engineering_technical, software_it, trades_construction]
  gm: [general_management, executive]
  ops: [operations, logistics_supply_chain]
  other: []

# ------------------------------------------------------------- sectors (17)
# Industry sector of a role, in the SAME vocabulary as approved_brands.csv
# `segment`, so "pre-purchase sector == purchased brand segment" is a
# meaningful affinity test. A role at an approved franchise brand takes the
# brand's segment directly (authoritative); every other role is classified
# here: employer text is tried first, in this order, first match wins; only
# when no employer pattern hits are the title patterns tried, same order.
# Roles matching nothing are 'unclassified'.
#
# STARTER CLASSIFIER. It has a long tail of misses and some false hits by
# design of the data (22k employers appear exactly once). The `employers`
# table (sorted ascending by record_count) is the review surface: fix a bad
# tag by editing a pattern here and rebuilding, never by editing output.
