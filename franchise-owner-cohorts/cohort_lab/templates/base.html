<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cohort Lab{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper:#F6F8F4; --card:#FFFFFF; --ink:#1B241F; --muted:#5C6862; --hairline:#DEE4DD;
    --accent:#2E7D4F; --accent-soft:#EAF2EC; --flag:#B4592E; --flag-soft:#F7EBE4;
    --series:#2a78d6; --series-rgb:42,120,214; --neg:#e34948; --neg-rgb:227,73,72; --mid:#f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper:#141A16; --card:#1C231E; --ink:#E9EDE8; --muted:#98A49C; --hairline:#2B342D;
      --accent:#5FB786; --accent-soft:#223529; --flag:#DB9265; --flag-soft:#3A2A20;
      --series:#3987e5; --series-rgb:57,135,229; --neg:#e66767; --neg-rgb:230,103,103; --mid:#383835;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:14.5px/1.5 "IBM Plex Sans",system-ui,sans-serif; padding:0 0 70px; }
  a { color:var(--accent); }
  nav.top { display:flex; gap:18px; align-items:center; padding:12px 22px; border-bottom:1px solid var(--hairline);
            background:var(--card); flex-wrap:wrap; }
  nav.top .brand { font-family:"Bricolage Grotesque",sans-serif; font-size:19px; font-weight:700; color:var(--ink);
                   text-decoration:none; letter-spacing:-.2px; margin-right:6px; }
  nav.top a.nav { color:var(--muted); text-decoration:none; font-weight:500; padding:4px 2px; border-bottom:2px solid transparent; }
  nav.top a.nav.active, nav.top a.nav:hover { color:var(--ink); border-bottom-color:var(--accent); }
  nav.top .spacer { flex:1; }
  nav.top .meta { color:var(--muted); font-size:12px; font-family:"IBM Plex Mono",monospace; }
  .wrap { max-width:1180px; margin:0 auto; padding:22px 18px 0; }
  h1 { font-family:"Bricolage Grotesque",sans-serif; font-size:26px; margin:0 0 4px; letter-spacing:-.3px; }
  h2 { font-family:"Bricolage Grotesque",sans-serif; font-size:17px; margin:0 0 6px; }
  h3 { font-size:14px; margin:14px 0 6px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  .sub { color:var(--muted); font-size:13px; }
  .mono { font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  .card { background:var(--card); border:1px solid var(--hairline); border-radius:12px; padding:16px 18px; margin-top:14px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; }
  .stat { background:var(--card); border:1px solid var(--hairline); border-radius:10px; padding:10px 16px; min-width:120px; }
  .stat .big { font-family:"Bricolage Grotesque",sans-serif; font-size:24px; font-weight:700; }
  .stat .cap { font-size:12px; color:var(--muted); }
  label.field { display:block; font-size:11px; color:var(--muted); font-family:"IBM Plex Mono",monospace;
                text-transform:uppercase; letter-spacing:.08em; }
  input[type=text], input[type=number], select, textarea {
    font:14px "IBM Plex Sans",sans-serif; color:var(--ink); background:var(--paper);
    border:1px solid var(--hairline); border-radius:8px; padding:7px 9px; }
  label.field input, label.field select { display:block; width:100%; margin-top:4px; }
  .hint { font-size:11.5px; color:var(--muted); text-transform:none; letter-spacing:0; margin-top:3px; }
  button, .btn { font:600 13.5px "IBM Plex Sans",sans-serif; padding:8px 16px; border-radius:9px;
                 border:1px solid var(--hairline); background:var(--card); color:var(--ink);
                 cursor:pointer; text-decoration:none; display:inline-block; }
  button.primary, .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .chip { display:inline-flex; gap:8px; align-items:center; font:12.5px "IBM Plex Mono",monospace; padding:4px 10px;
          border-radius:999px; background:var(--accent-soft); color:var(--ink); border:1px solid transparent; }
  .chip a { color:var(--muted); text-decoration:none; font-weight:700; }
  .chip a:hover { color:var(--flag); }
  .chip.group { background:var(--card); border-color:var(--hairline); }
  .pill { display:inline-block; font:11px "IBM Plex Mono",monospace; padding:2px 8px; border-radius:999px;
          background:var(--accent-soft); color:var(--accent); }
  .pill.warn { background:var(--flag-soft); color:var(--flag); }
  .barlist { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .barrow { display:grid; grid-template-columns:minmax(180px,300px) 1fr 150px; gap:12px; align-items:center;
            text-decoration:none; color:var(--ink); border-radius:6px; }
  a.barrow:hover { background:var(--accent-soft); }
  .barrow .lbl { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .barrow .track { height:14px; }
  .barrow .fill { height:100%; background:var(--series); border-radius:0 4px 4px 0; min-width:2px; }
  .barrow .val { font-family:"IBM Plex Mono",monospace; font-size:12.5px; text-align:right; white-space:nowrap; }
  .barrow .val .pct { color:var(--muted); margin-left:8px; }
  .tablewrap { overflow-x:auto; margin-top:8px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th { text-align:left; font:500 10.5px "IBM Plex Mono",monospace; text-transform:uppercase; letter-spacing:.08em;
       color:var(--muted); padding:0 12px 7px 0; border-bottom:1px solid var(--hairline); white-space:nowrap; }
  th a { color:var(--muted); text-decoration:none; }
  th a.on { color:var(--ink); }
  td { padding:6px 12px 6px 0; border-bottom:1px solid var(--hairline); vertical-align:top; max-width:320px;
       overflow-wrap:anywhere; }
  td.num { font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  td a.cell { color:var(--ink); text-decoration:none; border-bottom:1px dotted var(--hairline); }
  td a.cell:hover { color:var(--accent); border-bottom-color:var(--accent); }
  table.matrix { width:auto; }
  table.matrix th.rowhead { text-align:left; }
  table.matrix th.colhead { writing-mode:vertical-rl; transform:rotate(180deg); text-align:left; padding:0 0 0 4px;
                            max-height:150px; height:150px; vertical-align:bottom; white-space:normal; }
  table.matrix td.cell { padding:0; border:2px solid var(--card); min-width:52px; }
  table.matrix td.cell a, table.matrix td.cell span { display:block; padding:6px 8px; text-align:right;
      font-family:"IBM Plex Mono",monospace; font-size:12.5px; text-decoration:none; color:var(--ink); }
  table.matrix td.cell .sub { display:block; font-size:10px; color:inherit; opacity:.75; text-align:right; }
  table.matrix td.cell.dark a, table.matrix td.cell.dark span { color:#fff; }
  table.matrix td.cell a:hover { outline:2px solid var(--accent); outline-offset:-2px; }
  details { margin-top:12px; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; }
  pre { background:var(--paper); border:1px solid var(--hairline); border-radius:8px; padding:12px 14px;
        overflow-x:auto; font:12px/1.5 "IBM Plex Mono",monospace; color:var(--ink); }
  .error { background:var(--flag-soft); color:var(--flag); border-radius:8px; padding:8px 12px; margin-top:8px; font-size:13px; }
  .notice { background:var(--accent-soft); border-radius:8px; padding:8px 12px; margin-top:8px; font-size:13px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }
  .legend { display:flex; gap:14px; align-items:center; font-size:12px; color:var(--muted); margin-top:8px; flex-wrap:wrap; }
  .legend .sw { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:middle; margin-right:5px; }
  ul.plain { list-style:none; padding:0; margin:6px 0 0; }
  ul.plain li { padding:5px 0; border-bottom:1px solid var(--hairline); }
  ul.plain li:last-child { border-bottom:none; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="top">
  <a class="brand" href="{{ url_for('home') }}">Cohort Lab</a>
  <a class="nav {% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">Home</a>
  <a class="nav {% if request.endpoint in ('explore',) %}active{% endif %}" href="{{ url_for('explore') }}">Explore</a>
  <a class="nav {% if request.endpoint == 'question' %}active{% endif %}" href="{{ url_for('question', qid='q1') }}">Questions</a>
  <a class="nav {% if request.endpoint == 'people' %}active{% endif %}" href="{{ url_for('people') }}">People finder</a>
  <a class="nav {% if request.endpoint == 'sql_box' %}active{% endif %}" href="{{ url_for('sql_box') }}">SQL</a>
  <span class="spacer"></span>
  <span class="meta">every number ships with its SQL · shares are share-of-owners until a comparison sample is loaded</span>
</nav>
<div class="wrap">
{% block body %}{% endblock %}
</div>
</body>
</html>
